<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image library – Digital Learning Team</title>
<meta name="robots" content="noindex">
<style>
:root{--pink:#DE00A5;--text:#0B0C0C;--grey:#505A5F;--border:#B1B4B6;--bg:#F3F2F1;--focus:#FFDD00}
*{box-sizing:border-box}
body{margin:0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--text);background:#fff;line-height:1.35}
header{background:var(--pink);color:#fff;padding:20px 0}
.w{max-width:1100px;margin:0 auto;padding:0 20px}
h1{margin:0;font-size:2rem}
header p{margin:6px 0 0}
main{padding:30px 0 50px}
.bar{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:end;margin-bottom:25px}
label{display:block;font-weight:700;margin-bottom:5px}
input{font:inherit;padding:6px;border:2px solid var(--text);width:min(320px,100%)}
input:focus{outline:3px solid var(--focus)}
#count{color:var(--grey);margin:0}
ul{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
li{border:1px solid var(--border);display:flex;flex-direction:column}
.thumb{display:block;background:var(--bg) repeating-conic-gradient(#e6e6e6 0 25%,#fff 0 50%) 0 0/16px 16px;aspect-ratio:4/3}
.thumb img{width:100%;height:100%;object-fit:contain;display:block}
.info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;flex:1}
.name{font-size:.9rem;word-break:break-all;margin:0}
.dims{font-size:.8rem;color:var(--grey);margin:0}
.actions{display:flex;gap:8px;margin-top:auto}
button,.open{font:inherit;font-size:.9rem;padding:6px 10px;border:2px solid var(--text);background:#fff;color:var(--text);cursor:pointer;text-decoration:none}
button:hover,.open:hover{background:var(--bg)}
button:focus,.open:focus,.thumb:focus{outline:3px solid var(--focus);outline-offset:0}
#status{margin:0 0 20px;font-weight:700}
</style>
</head>
<body>
<header><div class="w"><h1>Image library</h1><p>Digital Learning Team e-learning resources: global assets</p></div></header>
<main class="w">
  <div class="bar">
    <div><label for="q">Search by file name</label><input id="q" type="search" autocomplete="off"></div>
    <p id="count" aria-live="polite"></p>
  </div>
  <p id="status" role="status"></p>
  <ul id="grid"></ul>
</main>
<script>
(function(){
  // Used if the automatic list can't load (for example, if the repository is private).
  var FALLBACK = [
    'img-callout-LearnMore-pink-cyan.webp',
    'img-callout-StudyFurther-pink-cyan.webp',
    'img-callout-didyouknow-pink-cyan.webp',
    'img-header-aims-pink-cyan.webp',
    'img-header-poll-pink-cyan.webp',
    'img-header-task-pink-cyan.webp'
  ];
  var API = 'https://api.github.com/repos/gds-dtx/digital-learning-team-elearning-resources/contents/global-assets/images?ref=main';
  var IMG = /\.(png|jpe?g|gif|webp|svg|avif)$/i;
  var grid = document.getElementById('grid'), q = document.getElementById('q'),
      count = document.getElementById('count'), status = document.getElementById('status');
  var files = [];

  function url(name){ return new URL(encodeURIComponent(name), location.href.replace(/[^\/]*$/, '')).href; }

  function render(){
    var term = q.value.trim().toLowerCase();
    var shown = files.filter(function(f){ return f.toLowerCase().indexOf(term) !== -1; });
    grid.innerHTML = '';
    shown.forEach(function(f){
      var u = url(f);
      var li = document.createElement('li');
      li.innerHTML =
        '<a class="thumb" href="' + u + '" target="_blank" rel="noopener"><img loading="lazy" alt="" src="' + u + '"></a>' +
        '<div class="info"><p class="name"></p><p class="dims"></p>' +
        '<div class="actions"><button type="button">Copy link</button>' +
        '<a class="open" href="' + u + '" target="_blank" rel="noopener">Open<span style="position:absolute;left:-9999px"> ' + f + ' (opens in new tab)</span></a></div></div>';
      li.querySelector('.name').textContent = f;
      li.querySelector('.thumb').setAttribute('aria-label', 'Open ' + f + ' (opens in new tab)');
      var img = li.querySelector('img'), dims = li.querySelector('.dims');
      img.addEventListener('load', function(){ dims.textContent = img.naturalWidth + ' × ' + img.naturalHeight + ' px'; });
      img.addEventListener('error', function(){ dims.textContent = 'Image not found'; });
      var btn = li.querySelector('button');
      btn.addEventListener('click', function(){
        function done(){ btn.textContent = 'Copied'; status.textContent = 'Link copied: ' + f; setTimeout(function(){ btn.textContent = 'Copy link'; }, 2000); }
        if (navigator.clipboard) navigator.clipboard.writeText(u).then(done, function(){ prompt('Copy this link:', u); });
        else prompt('Copy this link:', u);
      });
      grid.appendChild(li);
    });
    count.textContent = shown.length + ' of ' + files.length + ' images';
  }

  function use(list){ files = list.filter(function(n){ return IMG.test(n); }).sort(function(a,b){ return a.localeCompare(b); }); render(); }

  q.addEventListener('input', render);
  use(FALLBACK);
  fetch(API, { headers: { Accept: 'application/vnd.github+json' } })
    .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(d){ if (Array.isArray(d)) use(d.filter(function(x){ return x.type === 'file'; }).map(function(x){ return x.name; })); })
    .catch(function(){ /* keep the fallback list */ });
})();
</script>
</body>
</html>
